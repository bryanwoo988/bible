<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>圣经 Bible</title>
  <meta name="description" content="中英对照圣经 · Chinese–English Bible">
  <meta name="theme-color" content="#faf8f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="圣经">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="圣经 Holy Bible · 中英对照">
  <meta property="og:description" content="和合本 + NIV 中英对照圣经，可离线使用、朗读、画线、笔记">
  <meta property="og:url" content="https://bryanwoo988.github.io/bible/">
  <meta property="og:image" content="https://bryanwoo988.github.io/bible/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply theme before first paint to avoid a flash.
    try {
      const s = JSON.parse(localStorage.getItem("bible.settings") || "{}");
      if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme;
      if (s.fontSize) document.documentElement.style.setProperty("--fs", s.fontSize + "px");
      if (s.ui) document.documentElement.lang = { zhs: "zh-Hans", zht: "zh-Hant", en: "en" }[s.ui] || "zh-Hans";
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="ref-btn" id="btn-ref" data-i18n-aria="aria.ref" aria-label="选择经卷章节">
      <span id="ref-label">创世记 1</span>
      <svg viewBox="0 0 24 24" class="chev"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="ver-pill" id="btn-version" data-i18n-aria="ver.title" aria-label="译本">
      <svg viewBox="0 0 24 24"><path d="M3 5h8M7 3v2M5 5c0 4 3 7 6 8M9 5c0 3-2 7-6 9"/><path d="M13 21l4-10 4 10M14.5 17.5h5"/></svg>
      <span id="ver-label"></span>
    </button>
    <button class="icon-btn labeled" id="btn-tts" data-i18n-aria="nav.read" aria-label="朗读">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <span class="lbl" data-i18n="nav.read">朗读</span>
    </button>
    <button class="icon-btn labeled" id="btn-intro" data-i18n-aria="nav.intro" aria-label="导读">
      <svg viewBox="0 0 24 24"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H11v17H5.5A1.5 1.5 0 0 1 4 18.5zM20 4.5A1.5 1.5 0 0 0 18.5 3H13v17h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      <span class="lbl" data-i18n="nav.intro">导读</span>
    </button>
  </header>

  <nav class="tabstrip" id="tabstrip" data-i18n-aria="aria.tabs" aria-label="分页"></nav>

  <main id="reader" class="reader" tabindex="-1">
    <div id="banner"></div>
    <article id="chapter" class="chapter"></article>
  </main>

  <div class="pager">
    <button class="pager-btn" id="btn-prev" data-i18n-aria="aria.prevChapter" aria-label="上一章"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="pager-btn" id="btn-next" data-i18n-aria="aria.nextChapter" aria-label="下一章"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  </div>

  <!-- Read-aloud player -->
  <div class="player" id="player" hidden>
    <div class="pl-top">
      <span class="pl-ref" id="pl-ref"></span>
      <button class="pl-speed" id="pl-speed" data-i18n-aria="tts.rate" aria-label="语速"></button>
    </div>
    <div class="pl-progress">
      <span id="pl-pos"></span>
      <input type="range" id="pl-bar" min="1" max="1" step="1" value="1" data-i18n-aria="pl.progress" aria-label="朗读进度">
      <span id="pl-total"></span>
    </div>
    <div class="pl-ctrl">
      <button id="pl-prev" data-i18n-aria="pl.prevVerse" aria-label="上一节"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5L9 12l10 7z"/></svg></button>
      <button id="pl-play" class="big" aria-label="暂停"></button>
      <button id="pl-next" data-i18n-aria="pl.nextVerse" aria-label="下一节"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z"/></svg></button>
      <button id="pl-stop" data-i18n-aria="pl.stop" aria-label="停止朗读"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
    </div>
  </div>

  <!-- Tap a verse: listen first; long-press for marking tools -->
  <div class="quickbar" id="quickbar" hidden>
    <button class="qb-play" id="qb-play"><svg viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></svg><span id="qb-label"></span></button>
    <button class="qb-mark" id="qb-mark"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span data-i18n="qb.mark">标记</span></button>
    <button class="qb-close" id="qb-close" data-i18n-aria="close" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <!-- Verse action bar -->
  <div class="actionbar" id="actionbar" hidden>
    <div class="ab-row">
      <div class="seg small" id="mark-mode">
        <button data-mode="hl" class="on" data-i18n="mark.hl">荧光笔</button>
        <button data-mode="ul" data-i18n="mark.ul">下划线</button>
      </div>
      <div class="colors" id="colors"></div>
    </div>
    <div class="ab-row ab-actions">
      <button data-act="note"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span data-i18n="act.note">笔记</span></button>
      <button data-act="bookmark"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span data-bm-label>书签</span></button>
      <button data-act="read"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><span data-i18n="act.read">朗读</span></button>
      <button data-act="copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg><span data-i18n="act.copy">复制</span></button>
      <button data-act="clear"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg><span data-i18n="act.clear">清除</span></button>
      <button data-act="done" class="done" data-i18n="act.done">完成</button>
    </div>
  </div>

  <!-- Full-screen pages: book list, chapters, notes, bookmarks, history, settings -->
  <section class="page" id="page" hidden>
    <header class="page-head">
      <button class="page-back" id="page-back" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><span id="page-back-label"></span></button>
      <h1 id="page-title"></h1>
      <div class="page-actions" id="page-actions"></div>
    </header>
    <div class="page-body" id="page-body"></div>
  </section>

  <nav class="bottomnav" id="bottomnav">
    <button data-nav="bible"><svg viewBox="0 0 24 24"><path d="M12 6.5C10.5 5 8 4.5 4 4.5v14c4 0 6.5.5 8 2 1.5-1.5 4-2 8-2v-14c-4 0-6.5.5-8 2z"/><path d="M12 6.5v14"/></svg><span data-i18n="tab.bible">内容</span></button>
    <button data-nav="notes"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg><span data-i18n="tab.notes">笔记</span></button>
    <button data-nav="bookmarks"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span data-i18n="tab.bookmarks">书签</span></button>
    <button data-nav="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="tab.history">历史</span></button>
    <button data-nav="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span data-i18n="tab.settings">设定</span></button>
  </nav>

  <!-- Generic bottom sheet -->
  <div class="scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <header class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button class="icon-btn" id="sheet-close" data-i18n-aria="close" aria-label="关闭"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <!-- First-run welcome -->
  <section class="welcome" id="welcome" hidden role="dialog" aria-modal="true"></section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
